name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Diagnose available Xcode/SDKs
        run: |
          echo "=== /Applications Xcode installs ===" | tee /tmp/diag.log
          ls /Applications | grep -i xcode | tee -a /tmp/diag.log
          echo "=== xcodebuild -version ===" | tee -a /tmp/diag.log
          xcodebuild -version | tee -a /tmp/diag.log
          echo "=== xcodebuild -showsdks ===" | tee -a /tmp/diag.log
          xcodebuild -showsdks | tee -a /tmp/diag.log
          echo "=== available runtimes/platforms ===" | tee -a /tmp/diag.log
          xcrun simctl list runtimes | tee -a /tmp/diag.log
          mkdir -p build
          cp /tmp/diag.log build/diag.log

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-editor
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Download Godot editor (headless export tool)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-editor
          curl -L -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot-editor

      - name: Download export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          curl -L -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* \
            "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project resources
        run: |
          mkdir -p build
          GODOT_BIN=$(find ~/godot-editor -name "Godot*" -type f | head -n1)
          echo "Resolved GODOT_BIN=$GODOT_BIN" | tee build/import.log
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --import --path "$GITHUB_WORKSPACE" 2>&1 | tee -a build/import.log || true

      - name: Export Xcode project (unsigned)
        run: |
          GODOT_BIN=$(find ~/godot-editor -name "Godot*" -type f | head -n1)
          mkdir -p build
          set +e
          "$GODOT_BIN" --headless --export-release "iOS" build/UrukDrive.ipa --path "$GITHUB_WORKSPACE" 2>&1 | tee build/export.log
          echo "EXPORT_EXIT_CODE=${PIPESTATUS[0]}" >> build/export.log
          exit "${PIPESTATUS[0]}"

      - name: Verify IPA was produced
        run: |
          ls -la build/
          test -f build/UrukDrive.ipa || (echo "::error::UrukDrive.ipa was not produced by the export step" && exit 1)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrukDrive-unsigned-ipa
          path: build/UrukDrive.ipa
          retention-days: 14

      - name: Commit build log to orphan branch
        if: always()
        run: |
          BRANCH="build-logs-${GITHUB_RUN_ID}"
          mkdir -p /tmp/logbranch
          cp build/import.log /tmp/logbranch/ 2>/dev/null || echo "no import.log" > /tmp/logbranch/import.log
          cp build/export.log /tmp/logbranch/ 2>/dev/null || echo "no export.log" > /tmp/logbranch/export.log
          cp build/diag.log /tmp/logbranch/ 2>/dev/null || echo "no diag.log" > /tmp/logbranch/diag.log
          echo "Build run: $GITHUB_RUN_ID at $(date -u)" > /tmp/logbranch/build-log.txt
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/logbranch/* .
          git add build-log.txt import.log export.log diag.log
          git -c user.name="ci-bot" -c user.email="ci@local" commit -m "Build log ${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/"$BRANCH" || true
